<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelle &amp; Co. — The New Season Edit</title>
  <link rel="stylesheet" href="/store.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Aurelle &amp; Co.</a>
      <nav class="site-nav">
        <a href="/">New In</a>
        <a href="/">Women</a>
        <a href="/">Men</a>
        <a href="/">Accessories</a>
        <a href="/">Sale</a>
      </nav>
      <div class="header-actions">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Search"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Bag"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
      </div>
    </div>
  </header>

  <section class="hero">
    <p class="hero-kicker">Autumn / Winter</p>
    <h1>The New Season Edit</h1>
    <p class="hero-sub">Considered pieces, made to last. Now with Mirror&nbsp;— see every piece on <em>you</em> before you buy.</p>
  </section>

  <main class="container">
    <div class="grid" id="product-grid"></div>
  </main>

  <footer class="site-footer">
    <p>Aurelle &amp; Co. — a demonstration storefront for the Mirror virtual try-on widget. Nothing here is for sale.</p>
  </footer>

  <script src="/store.js"></script>

  <!-- ══════════════════════════════════════════════════════════════
       Mirror virtual try-on — this ONE line is the entire integration
       a retailer needs to add to their site.
       ══════════════════════════════════════════════════════════════ -->
  <script src="/mirror.js" defer></script>
</body>
</html>
